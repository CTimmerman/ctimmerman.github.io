<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Gundam Card Game implementation by Cees Timmerman, 2026-05-11 - 09-12</title>
	<link rel="icon" href="icon32.png" />
	<link rel="manifest" href="gundam.webmanifest" />
	<style>
		button,
		html,
		input,
		select {
			--fgcolor: white;
			--bgcolor: black;
			--WHITE: #ffffff;
			--BLUE: #0077bb;
			--PURPLE: #764A92;
			--RED: #bb0055;
			--GREEN: #62A43E;
			--BROWN: #C6A474;
			background-color: var(--bgcolor);
			color: var(--fgcolor);
			scrollbar-color: var(--fgcolor) var(--bgcolor);
			scrollbar-width: thin;
			font-family: monospace;
			height: 1.5em;
		}

		select::-webkit-scrollbar {
			width: 12px;
			height: 12px;
		}

		select::-webkit-scrollbar-track {
			background-color: var(--bgcolor);
		}

		select::-webkit-scrollbar-thumb {
			background-color: var(--fgcolor);
			border: 4px solid var(--bgcolor);
			border-radius: 12px;
		}

		a {
			color: var(--fgcolor);
			font-family: monospace;
		}

		button,
		span {
			cursor: pointer;
		}

		button:disabled {
			color: grey;
			opacity: 75%;
		}

		input[type=checkbox] {
			vertical-align: middle;
		}

		input[type=range] {
			vertical-align: middle;
			width: 150px;
		}

		input[type=number]::-webkit-inner-spin-button,
		input[type=number]::-webkit-outer-spin-button {
			-webkit-appearance: visible;
			/* transform: rotate(90deg); */
			/* height: 40px; */
			/* opacity: 50%; */
			filter: invert(100%);
		}

		a:visited {
			color: grey;
		}

		body {
			margin: 0;
		}

		textarea {
			position: absolute;
			scrollbar-width: thin;
			color: var(--fgcolor);
			background-color: #08080888;
			top: 70vmin;
			left: 80vmin;
			width: 30vmin;
			height: 20vmin;
		}

		#battlefield {
			background-image: url(GundamPlayMat.png);
			background-size: contain;
			background-repeat: no-repeat;
			position: absolute;
			width: 100vmin;
			height: 100vmin;
		}

		#dlog {
			position: absolute;
			margin: 0 0 0 85vmin;
			width: stretch;
			height: 100vmin;
			overflow-y: scroll;
			scrollbar-width: thin;
			background-color: #08080888;
			border: 1px solid grey;
		}

		#dstatus {
			width: 32em;
		}

		#dtimeleft {
			background-color: #08080888;
			border: 4px solid yellow;
			display: none;
			padding: 5px;
			position: absolute;
			top: 47vmin;
			left: 40vmin;
		}

		#overlay {
			display: none;
			position: absolute;
			font-size: 4vmin;
			z-index: 9000;
			width: 100%;
			height: 100%;
		}

		.pricecheck {
			float: right;
			cursor: help;
			width: 1vmin;
			height: 0.5vmin;
		}

		#settings {
			z-index: 9001;
			position: absolute;
			border: 0px solid #00000000;
			left: 0.5vmin;
			top: 47vmin;
			width: 4vmin;
			height: 4vmin;
			text-align: center;
			overflow: hidden !important;
			padding-top: 2px;
			transition: 0.2s;
		}

		#search {
			z-index: 9001;
			position: absolute;
			width: 120vmin;
			/* https://caniuse.com/?search=width%3Astretch */
			height: 100vmin;
			text-align: center;
			overflow: auto;
			transition: 0.1s;
			background-color: #08080888;
			border: 1px solid grey;
			scrollbar-color: var(--fgcolor) var(--bgcolor);
			scrollbar-width: thin;
			top: 0vmin;
		}

		#searchtext {
			width: 42vmin;
		}

		.searchsmall {
			background-color: #00000000 !important;
			height: 4vmin !important;
			width: 4vmin !important;
			margin-top: 2px;
			overflow: hidden !important;
			border: 0px solid grey !important;
			top: 47vmin !important;
			left: 5vmin !important;
		}

		.icon {
			cursor: pointer;
			font-size: 3vmin;
		}

		#wheel {
			transition: 0.3s;
		}

		.open #wheel {
			transform: rotate(360deg);
		}

		.open {
			width: auto !important;
			height: auto !important;
			background-color: #08080888;
			border: 1px solid grey !important;
			padding: 0.5em;
		}

		.card {
			background-size: contain;
			background-repeat: no-repeat;
			border: 1px solid var(--BROWN);
			border-radius: 0.6vmin;
			color: yellow;
			cursor: pointer;
			position: absolute;
			width: 10vmin;
			height: 13.96vmin;
			font-size: small;
			text-align: center;
			text-shadow: 1px 1px #08080888;
			transition: 0.1s;
		}

		.facedown {
			background-image: url(sleeve.webp) !important;
			background-color: white !important;
			border-color: black !important;
		}

		.facedown.resource {
			background-image: url(ResourceCardBack.webp) !important;
			background-color: white !important;
		}

		.bad {
			border: 4px solid red !important;
		}

		.glow {
			border: 4px solid yellow !important;
		}

		.rested {
			transform: rotate(90deg);
			margin-top: -1.4vmin;
		}

		.rested.resource {
			transform: rotate(70deg);
			margin: auto;
		}

		@keyframes kfRotY {
			to {
				transform: rotateY(360deg);
			}
		}

		.rotY {
			display: inline-table;
			height: 1em;
			width: 1em;
			animation: kfRotY 4s linear infinite;
		}
	</style>
</head>

<body>
	<div id="overlay"></div>
	<div id="search" class="searchsmall">
		<div onclick="toggleSearch()" class="icon" title="Search">🔎<label for="searchtext">Search</label></div>
		<input id="searchtext" onchange="findCards(this.value)" placeholder="Supports AND, OR, and NOT.">
		<div id="searchresults"></div>
	</div>
	<div id="battlefield"></div>
	<div id="dlog">
		<a href="https://www.gundam-gcg.com/en/rules/">Gundam Card Game</a><br>
	</div>
	<audio id="pewpew" src="pewpew.opus"></audio>
	<audio id="boom" src="boom.opus"></audio>
	<div id="settings">
		<div id="wheel" class="icon" title="Settings" onclick="toggleSettings()">⚙️</div>
		<div>
			<label for="volume">Volume</label>
			<input id="volume" type="range" value="0.1" min="0" max="1" step="0.1" onchange="setVolume()" /><br>
		</div>
		<div>
			<label for="ngames">Games</label> <input id="ngames" type="number" value="1" min="1" max="99999"
				style="width: 55px;" onchange="games = this.value" oninput="clamp(this)" />
			<label for="nspeed">Speed</label> <input id="nspeed" type="number" value="50" min="0" max="100"
				style="width: 40px;" onchange="setSpeed()" oninput="clamp(this)" />%
			<button id="bstart" disabled="true"
				onclick="stop = false; if (game_over) { setTimeout(playGames, 0) } else alert('Game in progress')">▶Begin</button>
			<button id="bstop" onclick="stop = true; setGameOver(true); log(`⛔Stop by user input`)">◼End</button>
		</div><br>
		<div>
			<label for="p1deck">P1 deck</label>
			<select id="p1deck" value="-1"></select>
			<span onclick='showDeck(p1deck.options[p1deck.selectedIndex].text); event.preventDefault()'>👀</span>
			<input id="p1ai" type="checkbox" checked="checked"><label for="p1ai">AI</label>
			<br>
			<label for="p2deck">P2 deck</label>
			<select id="p2deck" value="-1"></select>
			<span onclick='showDeck(p2deck.options[p2deck.selectedIndex].text); event.preventDefault()'>👀</span>
			<input id="p2ai" type="checkbox" checked="checked"><label for="p2ai">AI</label>
			<br>
			<label for="deckOrder">Decklist order</label>
			<select id="deckOrder" value="TLCN">
				<option value="TLCN">Type, Level, Cost, Name</option>
				<option value="LTCN">Level, Type, Cost, Name</option>
				<option value="CTLN">Cost, Type, Level, Name</option>
			</select>
		</div><br>
		<div>
			<button id="bhone" onclick="stop = false; setTimeout(honeDeck, 0)">⚔️Hone P1 deck</button>/<input id="nhone"
				type="number" value="1" min="0" max="999" style="width: 40px;" oninput="clamp(this)" />
			<button onclick="compareDecks()">⇄Compare decks</button>
		</div>
		<div id="dstatus"></div>
	</div>
	<div id="dtimeleft" onclick="chosen = false"></div>
	<script src="gundam.js"></script>
</body>

</html>
